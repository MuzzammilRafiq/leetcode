<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#111111"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>DSA Patterns</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #111111;
        --muted: #737373;
        --faint: #b0b0b0;
        --line: #ececec;
        --soft: #f6f6f6;
        --hl: #fff6d6;
        --sans:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --mono:
          ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --pad: max(20px, env(safe-area-inset-left));
        --pad-r: max(20px, env(safe-area-inset-right));
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111111;
          --text: #ededed;
          --muted: #8f8f8f;
          --faint: #555555;
          --line: #242424;
          --soft: #1a1a1a;
          --hl: #33301f;
        }
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html {
        scroll-behavior: smooth;
        scroll-padding-top: 120px;
      }

      body {
        margin: 0;
        color: var(--text);
        background: var(--bg);
        font: 15px/1.55 var(--sans);
        -webkit-font-smoothing: antialiased;
      }

      button,
      input {
        font: inherit;
        color: inherit;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      :focus-visible {
        outline: 2px solid var(--text);
        outline-offset: 2px;
        border-radius: 2px;
      }

      .wrap {
        max-width: 660px;
        margin: 0 auto;
        padding-left: var(--pad);
        padding-right: var(--pad-r);
      }

      .text-btn {
        padding: 0;
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
      }

      .text-btn:hover,
      .text-btn.on {
        color: var(--text);
      }

      /* Header */

      .intro {
        padding-top: max(56px, env(safe-area-inset-top));
      }

      .intro h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }

      .intro p {
        margin: 4px 0 0;
        color: var(--muted);
      }

      .toc {
        columns: 2;
        column-gap: 32px;
        margin: 36px 0 0;
        font-size: 14px;
      }

      .toc a {
        display: flex;
        gap: 8px;
        padding: 3px 0;
        break-inside: avoid;
        color: var(--muted);
      }

      .toc a:hover {
        color: var(--text);
      }

      .toc .n {
        margin-left: auto;
        color: var(--faint);
        font: 12px/1.9 var(--mono);
        font-variant-numeric: tabular-nums;
      }

      .toc a.done,
      .toc a.done .n {
        color: var(--text);
      }

      .bar {
        position: sticky;
        top: 0;
        z-index: 10;
        margin-top: 40px;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
      }

      .bar .wrap {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px 20px;
        padding-top: max(12px, env(safe-area-inset-top));
        padding-bottom: 12px;
      }

      .search {
        flex: 1 1 160px;
        min-width: 0;
        height: 32px;
        padding: 0;
        border: 0;
        background: none;
        outline: none;
        font-size: 16px;
      }

      .search::placeholder {
        color: var(--faint);
      }

      .search::-webkit-search-cancel-button {
        display: none;
      }

      .filters {
        display: flex;
        gap: 16px;
        font-size: 14px;
      }

      .bar .random {
        font-size: 14px;
        margin-left: auto;
      }

      /* Patterns */

      .pattern {
        padding-top: 56px;
      }

      .pattern h2 {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .count {
        margin-left: auto;
        color: var(--faint);
        font: 400 12px var(--mono);
        font-variant-numeric: tabular-nums;
      }

      .count.done {
        color: var(--text);
      }

      .idea {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .tpl {
        margin-top: 8px;
        font-size: 14px;
      }

      .tpl summary {
        display: inline;
        color: var(--faint);
        cursor: pointer;
        list-style: none;
      }

      .tpl summary::-webkit-details-marker {
        display: none;
      }

      .tpl summary:hover,
      .tpl[open] summary {
        color: var(--text);
      }

      .tpl summary::after {
        content: " +";
      }

      .tpl[open] summary::after {
        content: " −";
      }

      .tpl-body {
        margin-top: 12px;
        padding: 16px;
        background: var(--soft);
        border-radius: 6px;
      }

      .tpl-body p {
        margin: 0 0 4px;
        color: var(--muted);
      }

      .tpl-body p b {
        color: var(--text);
        font-weight: 500;
      }

      .tpl-code {
        position: relative;
        margin-top: 12px;
      }

      .tpl-code .copy {
        position: absolute;
        top: 0;
        right: 0;
        font-size: 12px;
      }

      pre {
        margin: 0;
        overflow: auto;
        font: 12.5px/1.65 var(--mono);
      }

      .problems {
        margin: 16px 0 0;
        padding: 0;
        list-style: none;
      }

      .row {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 5px 0;
      }

      .row.picked {
        margin: 0 -8px;
        padding: 5px 8px;
        background: var(--hl);
        border-radius: 4px;
      }

      .check {
        position: relative;
        flex: none;
        width: 22px;
        height: 24px;
        margin: -2px 0 -2px -4px;
        padding: 0;
        border: 0;
        background: none;
        cursor: pointer;
      }

      .check::before {
        content: "";
        position: absolute;
        top: 5px;
        left: 4px;
        width: 13px;
        height: 13px;
        border: 1.5px solid var(--faint);
        border-radius: 3px;
      }

      .check:hover::before {
        border-color: var(--muted);
      }

      .row.solved .check::before {
        background: var(--text);
        border-color: var(--text);
      }

      .row.solved .check::after {
        content: "";
        position: absolute;
        top: 7px;
        left: 8.5px;
        width: 3.5px;
        height: 7px;
        border: solid var(--bg);
        border-width: 0 1.75px 1.75px 0;
        transform: rotate(45deg);
      }

      .ptitle {
        min-width: 0;
        overflow-wrap: anywhere;
      }

      .ptitle:hover {
        text-decoration: underline;
        text-decoration-color: var(--faint);
        text-underline-offset: 3px;
      }

      .row.solved .ptitle {
        color: var(--faint);
      }

      .star {
        color: var(--faint);
        font-size: 11px;
        margin-left: 4px;
      }

      .diff {
        margin-left: 8px;
        font-size: 11px;
        letter-spacing: 0.02em;
      }

      .diff-easy {
        color: #2f9e6b;
      }

      .diff-medium {
        color: #c98a12;
      }

      .diff-hard {
        color: #d4473f;
      }

      .row.solved .diff {
        opacity: 0.5;
      }

      .pnote {
        display: block;
        color: var(--faint);
        font-size: 13px;
      }

      .pid {
        margin-left: auto;
        padding-left: 12px;
        color: var(--faint);
        font: 12px/1.95 var(--mono);
        font-variant-numeric: tabular-nums;
      }

      .empty {
        margin: 12px 0 0;
        color: var(--muted);
      }

      /* Reference + footer */

      .extras {
        margin-top: 80px;
        border-top: 1px solid var(--line);
      }

      .extras details {
        border-bottom: 1px solid var(--line);
      }

      .extras summary {
        padding: 14px 0;
        color: var(--muted);
        font-size: 14px;
        cursor: pointer;
        list-style: none;
      }

      .extras summary::-webkit-details-marker {
        display: none;
      }

      .extras summary::after {
        content: "+";
        float: right;
        color: var(--faint);
      }

      .extras details[open] summary {
        color: var(--text);
      }

      .extras details[open] summary::after {
        content: "−";
      }

      .ref {
        margin: 0 0 20px;
        padding: 0;
        list-style: none;
        font-size: 14px;
      }

      .ref li {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        padding: 4px 0;
      }

      .ref li span:first-child {
        color: var(--muted);
      }

      ol.ref {
        columns: 2;
        column-gap: 32px;
        list-style: decimal inside;
        color: var(--faint);
      }

      ol.ref li {
        display: list-item;
        break-inside: avoid;
      }

      ol.ref a {
        color: var(--muted);
      }

      ol.ref a:hover {
        color: var(--text);
      }

      .footer {
        padding-top: 32px;
        padding-bottom: calc(64px + env(safe-area-inset-bottom));
        color: var(--faint);
        font-size: 13px;
      }

      .footer .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
      }

      .footer .text-btn {
        color: var(--faint);
      }

      .footer .text-btn:hover {
        color: var(--text);
      }

      .footer p {
        margin: 16px 0 0;
      }

      .footer a {
        color: var(--muted);
      }

      .footer a:hover {
        color: var(--text);
      }

      .status {
        margin-right: auto;
      }

      /* Random picker */

      .sheet {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: none;
      }

      .sheet.open {
        display: block;
      }

      .sheet-bg {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.25);
      }

      .pick-panel {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        padding: 24px var(--pad-r) calc(24px + env(safe-area-inset-bottom))
          var(--pad);
        background: var(--bg);
        border-radius: 12px 12px 0 0;
      }

      .pick-label {
        color: var(--faint);
        font-size: 13px;
      }

      .pick-panel h2 {
        margin: 8px 0 0;
        font-size: 18px;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }

      .pick-panel h2 .pid {
        margin: 0 8px 0 0;
        padding: 0;
        font-size: 14px;
        font-weight: 400;
      }

      .pick-meta {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .pick-actions {
        display: flex;
        gap: 20px;
        align-items: center;
        margin-top: 24px;
        font-size: 14px;
      }

      .pick-go {
        padding: 8px 14px;
        border-radius: 6px;
        background: var(--text);
        color: var(--bg);
        font-weight: 500;
      }

      .pick-go:hover {
        opacity: 0.85;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 559px) {
        .toc {
          columns: 1;
        }

        ol.ref {
          columns: 1;
        }

        .ref li {
          grid-template-columns: 1fr;
          gap: 0;
          padding: 6px 0;
        }

        .search {
          flex-basis: 100%;
        }

        .bar .wrap {
          gap: 4px 16px;
          padding-bottom: 10px;
        }

        .row {
          padding: 7px 0;
        }
      }

      @media (min-width: 560px) {
        html {
          scroll-padding-top: 72px;
        }

        .intro {
          padding-top: 88px;
        }

        .search {
          font-size: 14px;
        }

        #random-sheet .pick-panel {
          left: 50%;
          right: auto;
          bottom: auto;
          top: 38%;
          transform: translate(-50%, -50%);
          width: min(420px, calc(100vw - 48px));
          padding: 28px;
          border: 1px solid var(--line);
          border-radius: 10px;
          box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
      }
    </style>
  </head>

  <body>
    <header class="intro wrap">
      <h1>DSA Patterns</h1>
      <p><span data-solved>0</span> of <span data-total>0</span> solved</p>
      <nav class="toc" id="toc" aria-label="Patterns"></nav>
    </header>

    <div class="bar">
      <div class="wrap">
        <input
          class="search"
          id="q"
          placeholder="Search"
          type="search"
          enterkeyhint="search"
          aria-label="Search problems"
        />
        <div class="filters" role="group" aria-label="Filter">
          <button class="text-btn on" data-filter="all" type="button">
            All
          </button>
          <button class="text-btn" data-filter="todo" type="button">
            Unsolved
          </button>
          <button class="text-btn" data-filter="done" type="button">
            Solved
          </button>
          <button class="text-btn" data-filter="star" type="button">
            Starred
          </button>
        </div>
        <button
          class="text-btn random"
          id="random-btn"
          type="button"
          aria-haspopup="dialog"
          aria-controls="random-sheet"
        >
          Random
        </button>
      </div>
    </div>

    <main class="wrap" id="patterns"></main>

    <div class="wrap">
      <div class="extras">
        <details>
          <summary>Recognizing patterns</summary>
          <ul class="ref" id="recognize-list"></ul>
        </details>
        <details>
          <summary>Master list</summary>
          <ol class="ref" id="overview"></ol>
        </details>
        <details>
          <summary>Further reading</summary>
          <ul class="ref" id="refs"></ul>
        </details>
      </div>

      <footer class="footer">
        <div class="actions">
          <span class="status" data-sync-status>saved locally</span>
          <button class="text-btn" data-action="sync" type="button">
            Enable sync
          </button>
          <button class="text-btn" data-action="export" type="button">
            Export
          </button>
          <button class="text-btn" data-action="import" type="button">
            Import
          </button>
          <button class="text-btn" data-action="reset" type="button">
            Reset
          </button>
        </div>
        <p>
          From the
          <a
            href="https://leetcode.com/discuss/post/8492532/dsa-pattern-wise-master-sheet-by-vishalb-vnx9/"
            target="_blank"
            rel="noopener"
            >DSA Pattern-Wise Master Sheet</a
          >
          by Alien_me.
        </p>
      </footer>
    </div>

    <div
      class="sheet"
      id="random-sheet"
      role="dialog"
      aria-modal="true"
      aria-labelledby="random-title"
    >
      <div class="sheet-bg" id="close-random"></div>
      <div class="pick-panel">
        <div class="pick-label" id="random-kicker">Random problem</div>
        <h2 id="random-title"></h2>
        <p class="pick-meta" id="random-meta"></p>
        <div class="pick-actions" id="random-actions">
          <a class="pick-go" id="random-open" target="_blank" rel="noopener"
            >Open on LeetCode</a
          >
          <button class="text-btn" id="random-again" type="button">
            Another
          </button>
          <button class="text-btn" id="random-close-btn" type="button" hidden>
            Close
          </button>
        </div>
      </div>
    </div>

          ["tree level / nearest / right side", "Tree BFS"],
          ["shortest path, unweighted", "Graph BFS"],
          ["shortest path, positive weights", "Dijkstra"],
          ["dependency / prerequisite / order", "Topological Sort"],
          ["connectivity / union / components", "Union Find / DSU"],
          ["all combinations / permutations / generate", "Backtracking"],
          ["answer built from previous answers", "Dynamic Programming"],
          ["prefix / autocomplete / dictionary", "Trie"],
          ["XOR / bits / masks / power of two", "Bit Manipulation"]
        ],
        "links": [
          [
            "Original LeetCode post",
            "https://leetcode.com/discuss/post/8492532/dsa-pattern-wise-master-sheet-by-vishalb-vnx9/"
          ],
          [
            "Sliding Window Patterns",
            "https://leetcode.com/discuss/post/1122776/summary-of-sliding-window-patterns-for-subarray-substring/"
          ],
          [
            "Complete Sliding Window Revision",
            "https://leetcode.com/discuss/post/8444355/sliding-window-patterns-complete-revisio-yhus/"
          ],
          [
            "C++ STL Containers Cheat Sheet",
            "https://leetcode.com/discuss/post/8446335/c-stl-containers-cheat-sheet-definitions-n76u/"
          ],
          [
            "50+ Useful C++ Functions",
            "https://leetcode.com/discuss/post/8369186/50-useful-c-functions-by-vishalbhagat185-i2fo/"
          ]
        ]
      }
    </script>
    <script>
      const DATA = JSON.parse(
        document.getElementById("sheet-json").textContent,
      );
      const KEY = "dsa-pattern-sheet-v1";
      const UPDATED_KEY = KEY + "-updated-at";
      let state = {};
      let stateUpdatedAt = Number(localStorage.getItem(UPDATED_KEY)) || 0;
      try {
        state = JSON.parse(localStorage.getItem(KEY) || "{}") || {};
      } catch (e) {
        state = {};
      }
      if (!stateUpdatedAt && Object.keys(state).length) {
        stateUpdatedAt = Date.now();
        try {
          localStorage.setItem(UPDATED_KEY, String(stateUpdatedAt));
        } catch (e) {}
      }
      let filter = "all";
      let query = "";
      let lastRandomId = null;
      let pickTimer = 0;

      let syncEnabled = false;
      let syncTimer = 0;
      let syncInFlight = false;
      let syncDirty = false;
      let syncRetryDelay = 1500;

      function setSyncStatus(text) {
        document
          .querySelectorAll("[data-sync-status]")
          .forEach((el) => (el.textContent = text));
      }

      function setSyncLabel(text) {
        document
          .querySelectorAll('[data-action="sync"]')
          .forEach((el) => (el.textContent = text));
      }

      function save(markChanged = true) {
        try {
          localStorage.setItem(KEY, JSON.stringify(state));
          if (markChanged) {
            stateUpdatedAt = Date.now();
            localStorage.setItem(UPDATED_KEY, String(stateUpdatedAt));
          }
        } catch (e) {}
        if (markChanged) queueRemoteSave();
      }

      function queueRemoteSave() {
        if (!syncEnabled) return;
        syncDirty = true;
        setSyncStatus("saving…");
        clearTimeout(syncTimer);
        syncTimer = setTimeout(flushRemoteSave, 450);
      }

      async function flushRemoteSave() {
        if (!syncEnabled || syncInFlight || !syncDirty) return;
        syncDirty = false;
        syncInFlight = true;
        const snapshot = JSON.stringify(state);
        const updatedAt = stateUpdatedAt;
        try {
          const response = await fetch("/api/progress", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ state: JSON.parse(snapshot), updatedAt }),
          });
          if (response.status === 401) {
            syncEnabled = false;
            setSyncLabel("Enable sync");
            setSyncStatus("saved locally");
            return;
          }
          if (!response.ok) throw new Error("Sync failed");
          syncRetryDelay = 1500;
          setSyncStatus("synced");
        } catch (error) {
          syncDirty = true;
          setSyncStatus("offline · saved locally");
        } finally {
          syncInFlight = false;
          if (syncDirty && syncEnabled) {
            clearTimeout(syncTimer);
            syncTimer = setTimeout(flushRemoteSave, syncRetryDelay);
            syncRetryDelay = Math.min(syncRetryDelay * 2, 60000);
          }
        }
      }

      async function loadRemoteProgress() {
        setSyncStatus("syncing…");
        try {
          const response = await fetch("/api/progress", { cache: "no-store" });
          if (response.status === 401) {
            syncEnabled = false;
            setSyncLabel("Enable sync");
            setSyncStatus("saved locally");
            return false;
          }
          if (response.status === 503) {
            setSyncStatus("saved locally");
            return false;
          }
          if (!response.ok) throw new Error("Sync unavailable");

          const remote = await response.json();
          syncEnabled = true;
          setSyncLabel("Sync now");

          if (remote.exists && remote.updatedAt > stateUpdatedAt) {
            state = remote.state || {};
            stateUpdatedAt = remote.updatedAt;
            localStorage.setItem(UPDATED_KEY, String(stateUpdatedAt));
            save(false);
            render();
          } else if (!remote.exists || stateUpdatedAt > remote.updatedAt) {
            queueRemoteSave();
            return true;
          }

          setSyncStatus("synced");
          return true;
        } catch (error) {
          setSyncStatus("offline · saved locally");
          return false;
        }
      }

      async function enableSync() {
        if (syncEnabled) {
          await loadRemoteProgress();
          return;
        }

        const password = prompt("Enter your sync password");
        if (!password) return;
        setSyncStatus("connecting…");
        try {
          const response = await fetch("/api/progress", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
          if (!response.ok) {
            alert(
              response.status === 401
                ? "Wrong sync password."
                : response.status === 503
                  ? "Sync is not configured on Vercel yet."
                  : "Could not enable sync.",
            );
            setSyncStatus("saved locally");
            return;
          }
          await loadRemoteProgress();
        } catch (error) {
          alert("Could not enable sync.");
          setSyncStatus("offline · saved locally");
        }
      }
      function pid(p) {
        return String(p.id);
      }
      function isSolved(id) {
        return !!state[String(id)];
      }
      function solved(p) {
        return isSolved(pid(p));
      }
      function setSolved(id, on) {
        id = String(id);
        if (on) state[id] = true;
        else delete state[id];
        save();
      }
      function lcUrl(p) {
        if (p.slug) return "https://leetcode.com/problems/" + p.slug + "/";
        return (
          "https://leetcode.com/problemset/?search=" + encodeURIComponent(p.id)
        );
      }
      function uniqueProblems() {
        const m = new Map();
        for (const pat of DATA.patterns)
          for (const p of pat.problems) m.set(pid(p), p);
        return [...m.values()];
      }
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function matchQuery(pat, p) {
        if (!query) return true;
        const blob = (
          pat.name +
          " " +
          p.title +
          " " +
          p.id +
          " " +
          (p.note || "") +
          " " +
          (p.difficulty || "") +
          " " +
          (pat.keywords || []).join(" ")
        ).toLowerCase();
        return blob.includes(query);
      }
      function visible(pat, p) {
        if (!matchQuery(pat, p)) return false;
        if (filter === "todo") return !solved(p);
        if (filter === "done") return solved(p);
        if (filter === "star") return !!p.star;
        return true;
      }
      function selectionLabel() {
        if (filter === "todo") return "Unsolved";
        if (filter === "done") return "Solved";
        if (filter === "star") return "Starred";
        return "All";
      }
      function matchingPool() {
        const m = new Map();
        for (const pat of DATA.patterns) {
          for (const p of pat.problems) {
            if (!visible(pat, p)) continue;
            const id = pid(p);
            if (!m.has(id)) {
              m.set(id, { p, patterns: [pat], star: !!p.star });
            } else {
              const entry = m.get(id);
              entry.patterns.push(pat);
              entry.star = entry.star || !!p.star;
            }
          }
        }
        return [...m.values()];
      }
      function pickRandom() {
        const pool = matchingPool();
        if (!pool.length) return null;
        let choices = pool;
        if (pool.length > 1 && lastRandomId) {
          const rest = pool.filter((x) => pid(x.p) !== lastRandomId);
          if (rest.length) choices = rest;
        }
        const pick = choices[Math.floor(Math.random() * choices.length)];
        lastRandomId = pid(pick.p);
        return pick;
      }
      function closeRandom() {
        document.getElementById("random-sheet").classList.remove("open");
        const row = document.querySelector(".row.picked");
        if (row) row.scrollIntoView({ behavior: "smooth", block: "center" });
        clearTimeout(pickTimer);
        pickTimer = setTimeout(() => {
          document.querySelectorAll(".row.picked").forEach((r) => {
            r.classList.remove("picked");
          });
        }, 4500);
      }
      function highlightPick(id) {
        document.querySelectorAll(".row.picked").forEach((row) => {
          row.classList.remove("picked");
        });
        clearTimeout(pickTimer);
        if (!id) return;
        const rows = document.querySelectorAll(`.row[data-id="${id}"]`);
        rows.forEach((row) => row.classList.add("picked"));
      }
      function showRandom(pick) {
        const sheetEl = document.getElementById("random-sheet");
        const title = document.getElementById("random-title");
        const meta = document.getElementById("random-meta");
        const kicker = document.getElementById("random-kicker");
        const open = document.getElementById("random-open");
        const again = document.getElementById("random-again");
        const closeBtn = document.getElementById("random-close-btn");
        const sel = selectionLabel();
        kicker.textContent = query
          ? `Random from ${sel.toLowerCase()} matching “${query}”`
          : `Random from ${sel.toLowerCase()}`;
        if (!pick) {
          title.textContent = "No matching problems";
          if (query) {
            meta.textContent =
              "Nothing matches this filter and search. Clear search or switch filters.";
          } else if (filter === "done") {
            meta.textContent = "No solved problems yet.";
          } else if (filter === "todo") {
            meta.textContent = "No unsolved problems left.";
          } else if (filter === "star") {
            meta.textContent = "No starred problems in this view.";
          } else {
            meta.textContent = "No problems to pick.";
          }
          open.hidden = true;
          open.removeAttribute("href");
          again.hidden = true;
          closeBtn.hidden = false;
          highlightPick(null);
          sheetEl.classList.add("open");
          return;
        }
        open.hidden = false;
        again.hidden = false;
        closeBtn.hidden = true;
        title.textContent = "";
        const idEl = document.createElement("span");
        idEl.className = "pid";
        idEl.textContent = pick.p.id;
        title.append(idEl, document.createTextNode(pick.p.title));
        if (pick.star) {
          const starEl = document.createElement("span");
          starEl.className = "star";
          starEl.textContent = "  ★";
          title.append(starEl);
        }
        const pats = [...new Set(pick.patterns.map((pat) => pat.name))].join(
          " · ",
        );
        meta.textContent = [
          pick.p.difficulty,
          pats,
          solved(pick.p) ? "Solved" : "Unsolved",
        ]
          .filter(Boolean)
          .join(" · ");
        open.href = lcUrl(pick.p);
        sheetEl.classList.add("open");
        highlightPick(pid(pick.p));
      }
      function renderOverview() {
        const jump = {
          1: "hashmap",
          2: "two-pointer",
          3: "sliding-window",
          4: "prefix-sum",
          5: "prefix-sum",
          6: "prefix-suffix",
          7: "binary-search",
          8: "binary-search",
          9: "sort-greedy",
          10: "linked-list",
          11: "stack",
          12: "stack",
          13: "sliding-window",
          14: "heap",
          15: "heap",
          16: "interval",
          17: "hashmap",
          18: "linked-list",
          19: "tree",
          20: "tree",
          21: "tree",
          22: "tree",
          23: "graph",
          24: "graph",
          25: "graph",
          26: "graph",
          27: "graph",
          28: "graph",
          29: "backtracking",
          30: "dp",
          31: "dp",
          32: "dp",
          33: "dp",
          34: "dp",
          35: "dp",
          36: "greedy",
          37: "string",
          38: "bits",
          39: "matrix",
          40: "recursion",
        };
        document.getElementById("overview").innerHTML = DATA.master
          .map(
            ([n, name, s]) =>
              `<li><a href="#${jump[n] || "two-pointer"}">${esc(name)}</a></li>`,
          )
          .join("");
      }

      function renderNav() {
        document.getElementById("toc").innerHTML = DATA.patterns
          .map((pat) => {
            const done = pat.problems.filter(solved).length;
            const total = pat.problems.length;
            return `<a href="#${pat.id}"${done === total ? ' class="done"' : ""}>${esc(pat.name)}<span class="n">${done}/${total}</span></a>`;
          })
          .join("");
      }

      const openTemplates = new Set();

      function diffTag(p) {
        if (!p.difficulty) return "";
        return `<span class="diff diff-${p.difficulty.toLowerCase()}">${p.difficulty}</span>`;
      }

      function problemRow(p) {
        const on = solved(p);
        return `<li class="row${on ? " solved" : ""}" data-id="${pid(p)}">
    <button class="check" type="button" data-toggle="${pid(p)}" aria-pressed="${on}" aria-label="${on ? "Mark unsolved" : "Mark solved"}: ${esc(p.title)}"></button>
    <div><a class="ptitle" href="${lcUrl(p)}" target="_blank" rel="noopener">${esc(p.title)}</a>${p.star ? '<span class="star" title="Starred">★</span>' : ""}${diffTag(p)}${p.note ? `<span class="pnote">${esc(p.note)}</span>` : ""}</div>
    <span class="pid">${p.id}</span>
  </li>`;
      }

      function renderPatterns() {
        const root = document.getElementById("patterns");
        const html = [];
        for (const pat of DATA.patterns) {
          const rows = pat.problems.filter((p) => visible(pat, p));
          if (!rows.length && (query || filter !== "all")) continue;
          const done = pat.problems.filter(solved).length;
          const total = pat.problems.length;
          const facts = [];
          if (pat.keywords && pat.keywords.length)
            facts.push(["Signals", pat.keywords.join(", ")]);
          if (pat.approaches)
            facts.push(["Also try", pat.approaches.join(", ")]);
          facts.push(["Time", pat.complexity]);
          html.push(`<section class="pattern" id="${pat.id}">
      <h2>${esc(pat.name)}<span class="count${done === total ? " done" : ""}">${done}/${total}</span></h2>
      <p class="idea">${esc(pat.idea)}</p>
      <details class="tpl" data-pat="${pat.id}"${openTemplates.has(pat.id) ? " open" : ""}>
        <summary>Template</summary>
        <div class="tpl-body">
          ${facts.map(([k, v]) => `<p><b>${k}</b> ${esc(v)}</p>`).join("")}
          <div class="tpl-code"><button class="text-btn copy" type="button">Copy</button><pre>${esc(pat.template)}</pre></div>
        </div>
      </details>
      <ul class="problems">${rows.map(problemRow).join("")}</ul>
    </section>`);
        }
        root.innerHTML =
          html.join("") ||
          `<section class="pattern"><p class="empty">No matching problems.</p></section>`;
      }

      function renderRecognize() {
        document.getElementById("recognize-list").innerHTML = DATA.recognize
          .map(
            ([a, b]) => `<li><span>${esc(a)}</span><span>${esc(b)}</span></li>`,
          )
          .join("");
        document.getElementById("refs").innerHTML = DATA.links
          .map(
            ([t, u]) =>
              `<li><a href="${u}" target="_blank" rel="noopener">${esc(t)}</a></li>`,
          )
          .join("");
      }

      function updateProgress() {
        const all = uniqueProblems();
        const n = all.filter(solved).length;
        const pct = all.length ? (100 * n) / all.length : 0;
        const set = (sel, fn) => document.querySelectorAll(sel).forEach(fn);
        set("[data-solved]", (el) => (el.textContent = n));
        set("[data-total]", (el) => (el.textContent = all.length));
        set("[data-pct]", (el) => (el.textContent = Math.round(pct) + "%"));
        set("[data-bar]", (el) => (el.style.width = pct + "%"));
      }

      function paintProblem(id) {
        const on = isSolved(id);
        document.querySelectorAll(`.row[data-id="${id}"]`).forEach((row) => {
          row.classList.toggle("solved", on);
          const btn = row.querySelector("[data-toggle]");
          btn.setAttribute("aria-pressed", on);
          btn.setAttribute(
            "aria-label",
            btn
              .getAttribute("aria-label")
              .replace(/^[^:]+/, on ? "Mark unsolved" : "Mark solved"),
          );
        });
        for (const pat of DATA.patterns) {
          if (!pat.problems.some((p) => pid(p) === id)) continue;
          const el = document.querySelector(`#${pat.id} .count`);
          if (!el) continue;
          const done = pat.problems.filter(solved).length;
          el.textContent = `${done}/${pat.problems.length}`;
          el.classList.toggle("done", done === pat.problems.length);
        }
      }

      function render() {
        renderOverview();
        renderNav();
        renderPatterns();
        renderRecognize();
        updateProgress();
      }

      document.addEventListener("click", (e) => {
        const chip = e.target.closest("[data-filter]");
        if (chip) {
          filter = chip.dataset.filter;
          document
            .querySelectorAll("[data-filter]")
            .forEach((c) => c.classList.toggle("on", c === chip));
          renderPatterns();
          closeRandom();
          return;
        }
        if (
          e.target.closest("#random-btn") ||
          e.target.closest("#random-again")
        ) {
          showRandom(pickRandom());
          return;
        }
        if (
          e.target.closest("#close-random") ||
          e.target.closest("#random-close-btn")
        ) {
          closeRandom();
          return;
        }
        const tog = e.target.closest("[data-toggle]");
        if (tog) {
          const id = tog.dataset.toggle;
          setSolved(id, !isSolved(id));
          if (filter !== "all" || query) renderPatterns();
          else paintProblem(id);
          renderNav();
          updateProgress();
          return;
        }
        const copy = e.target.closest(".copy");
        if (copy) {
          const pre = copy.closest(".tpl-code").querySelector("pre");
          if (pre) navigator.clipboard.writeText(pre.textContent);
          copy.textContent = "Copied";
          setTimeout(() => (copy.textContent = "Copy"), 900);
          return;
        }
        const action = e.target.closest("[data-action]")?.dataset.action;
        if (action === "reset") {
          const scope = syncEnabled ? "everywhere" : "on this device";
          if (confirm(`Clear all solved progress ${scope}?`)) {
            state = {};
            save();
            render();
          }
          return;
        }
        if (action === "sync") {
          enableSync();
          return;
        }
        if (action === "export") {
          const blob = new Blob([JSON.stringify(state, null, 2)], {
            type: "application/json",
          });
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = "dsa-pattern-progress.json";
          a.click();
          return;
        }
        if (action === "import") {
          const inp = document.createElement("input");
          inp.type = "file";
          inp.accept = "application/json";
          inp.onchange = async () => {
            try {
              const text = await inp.files[0].text();
              Object.assign(state, JSON.parse(text));
              save();
              render();
            } catch (err) {
              alert("Could not import that file.");
            }
          };
          inp.click();
        }
      });

      document.addEventListener(
        "toggle",
        (e) => {
          const pat = e.target.dataset && e.target.dataset.pat;
          if (!pat) return;
          if (e.target.open) openTemplates.add(pat);
          else openTemplates.delete(pat);
        },
        true,
      );

      document.getElementById("q").addEventListener("input", (e) => {
        query = e.target.value.trim().toLowerCase();
        renderPatterns();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "/" && document.activeElement.tagName !== "INPUT") {
          e.preventDefault();
          document.getElementById("q").focus();
        }
        if (e.key === "Escape") {
          closeRandom();
        }
      });
      render();
      loadRemoteProgress();
    </script>
  </body>
</html>
